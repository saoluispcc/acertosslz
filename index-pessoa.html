<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Protocolo Interno | Acesso Restrito</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Segoe UI', monospace;
            background: #030303;
            color: #4a4a4a;
            min-height: 100vh;
        }

        /* Fundo neutro opressivo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 1.5rem;
            position: relative;
            z-index: 2;
        }

        /* Cabeçalho seco, direto */
        .header {
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #2a2a2a;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.6rem;
            color: #2a2a2a;
            margin-top: 0.25rem;
        }

        /* Timer */
        .timer-block {
            background: #0a0a0a;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            border: 1px solid #1a1a1a;
        }

        .timer-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #3a3a3a;
            margin-bottom: 0.5rem;
        }

        .timer {
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            color: #5a5a5a;
            letter-spacing: 3px;
        }

        .timer-warning {
            font-size: 0.6rem;
            color: #3a3a3a;
            margin-top: 0.5rem;
        }

        /* Cards */
        .card {
            background: #080808;
            border: 1px solid #151515;
            margin-bottom: 1rem;
        }

        .card-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #151515;
        }

        .card-header h2 {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #3a3a3a;
        }

        .card-body {
            padding: 1rem;
        }

        /* Identidade */
        .identidade {
            background: #050505;
            padding: 0.75rem;
            text-align: center;
            margin-bottom: 1rem;
            border: 1px solid #151515;
        }

        .identidade-label {
            font-size: 0.55rem;
            color: #3a3a3a;
            text-transform: uppercase;
        }

        .identidade-valor {
            font-size: 1.1rem;
            font-weight: 600;
            color: #6a6a6a;
            margin-top: 0.25rem;
            font-family: monospace;
            word-break: break-word;
        }

        /* Mensagens - sem enfeites */
        .mensagens {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .mensagem-item {
            background: #050505;
            padding: 0.75rem;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #5a5a5a;
            border-left: 2px solid #2a2a2a;
        }

        /* Fotos */
        .fotos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .foto {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
            background: #050505;
            border: 1px solid #1a1a1a;
            filter: grayscale(0.8) contrast(1.1);
            transition: 0.2s;
        }

        .foto:hover {
            filter: grayscale(0.4);
            border-color: #2a2a2a;
        }

        /* Botão */
        .btn-acao {
            background: #0a0a0a;
            color: #5a5a5a;
            border: 1px solid #1a1a1a;
            padding: 0.8rem;
            width: 100%;
            margin: 1rem 0;
            font-family: monospace;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-acao:hover {
            background: #111;
            color: #7a7a7a;
        }

        /* Comprovantes */
        .comprovante-area {
            background: #050505;
            padding: 0.75rem;
            margin-top: 1rem;
            border: 1px solid #151515;
        }

        .comprovante-title {
            font-size: 0.6rem;
            color: #3a3a3a;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .comprovante-list {
            max-height: 180px;
            overflow-y: auto;
        }

        .comprovante-item {
            background: #0a0a0a;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #151515;
        }

        .comprovante-nome {
            font-size: 0.65rem;
            color: #5a5a5a;
        }

        .comprovante-data {
            font-size: 0.5rem;
            color: #3a3a3a;
        }

        .comprovante-download {
            background: #0a0a0a;
            color: #6a6a6a;
            border: 1px solid #1a1a1a;
            padding: 0.2rem 0.5rem;
            font-size: 0.55rem;
            cursor: pointer;
            text-decoration: none;
        }

        .comprovante-input {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }

        .file-btn, .btn-enviar {
            background: #0a0a0a;
            padding: 0.6rem;
            border: 1px solid #1a1a1a;
            color: #5a5a5a;
            font-size: 0.7rem;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        /* Chat */
        .chat-area {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #151515;
        }

        .chat-area.ativo {
            display: block;
        }

        .chat-messages {
            background: #050505;
            height: 220px;
            overflow-y: auto;
            padding: 0.5rem;
            margin-bottom: 0.75rem;
            border: 1px solid #151515;
        }

        .message {
            margin-bottom: 0.75rem;
            padding: 0.4rem 0.6rem;
            font-size: 0.7rem;
            max-width: 85%;
        }

        .message-admin {
            background: #0a0a0a;
            color: #6a6a6a;
            margin-left: auto;
            border-left: 1px solid #2a2a2a;
        }

        .message-user {
            background: #0a0a0a;
            color: #5a5a5a;
            margin-right: auto;
            border-right: 1px solid #1a1a1a;
        }

        .message small {
            font-size: 0.5rem;
            opacity: 0.5;
        }

        .chat-input {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .chat-input input {
            flex: 1;
            padding: 0.6rem;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            color: #6a6a6a;
            font-size: 0.7rem;
        }

        .chat-send {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            color: #5a5a5a;
            padding: 0.6rem 1rem;
            cursor: pointer;
        }

        .sala-fechada {
            text-align: center;
            padding: 1.5rem;
            background: #080808;
            border: 1px solid #1a1a1a;
        }

        .sala-fechada h1 {
            font-size: 1rem;
            color: #4a4a4a;
            margin-bottom: 0.5rem;
        }

        .loading, .empty-state {
            text-align: center;
            padding: 2rem;
            color: #3a3a3a;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            color: #5a5a5a;
            padding: 0.5rem 1rem;
            font-size: 0.7rem;
            z-index: 1000;
        }

        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border: 1px solid #1a1a1a;
        }

        .close-img {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 1.5rem;
            color: #5a5a5a;
            cursor: pointer;
            background: none;
            border: none;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-container {
            max-width: 90%;
            max-height: 90%;
            position: relative;
            border: 1px solid #1a1a1a;
        }

        .popup-container img {
            max-width: 100%;
            max-height: 85vh;
            display: block;
        }

        .popup-close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: #5a5a5a;
            border: none;
            width: 26px;
            height: 26px;
            cursor: pointer;
        }

        .popup-timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(90,90,90,0.3);
        }

        .timer-fill {
            height: 100%;
            width: 100%;
            background: #5a5a5a;
            animation: timerProgress linear forwards;
        }

        @keyframes timerProgress {
            from { width: 100%; }
            to { width: 0%; }
        }
    </style>
</head>
<body>
<div id="loading" class="loading">acessando protocolo...</div>
<div id="content" style="display: none;"></div>
<div id="imageModal" class="image-modal" onclick="fecharImagem()">
    <button class="close-img" onclick="fecharImagem()">✕</button>
    <img id="modalImage" src="">
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const salaId = urlParams.get('id');
    let visitanteId = localStorage.getItem('visitanteId');
    let currentExpiraEm = null;
    let timerInterval = null;
    let chatUnsubscribe = null;
    let popupUnsubscribe = null;
    let chatAtivo = false;

    if (!visitanteId) {
        visitanteId = 'v_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('visitanteId', visitanteId);
    }

    if (!salaId) {
        document.getElementById('loading').innerHTML = '<div class="empty-state">acesso negado</div>';
    } else {
        registrarVisita();
        carregarCasa(salaId);
        monitorarTempoDaSala(salaId);
        monitorarConfiguracoes(salaId);
    }

    async function registrarVisita() {
        const snapshot = await db.ref(`casas/${salaId}`).once('value');
        const casa = snapshot.val();
        if (casa && casa.nome) {
            await db.ref(`visitantes/${visitanteId}`).set({
                salaId: salaId,
                salaNome: casa.nome,
                idVisitante: visitanteId,
                entrada: Date.now(),
                ultimaAtividade: Date.now()
            });
            setInterval(() => {
                db.ref(`visitantes/${visitanteId}/ultimaAtividade`).set(Date.now());
            }, 30000);
        }
    }

    function abrirImagem(src) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        modal.style.display = 'flex';
        modalImg.src = src;
    }

    function fecharImagem() {
        document.getElementById('imageModal').style.display = 'none';
    }

    function monitorarTempoDaSala(id) {
        db.ref(`casas/${id}`).on('value', (snapshot) => {
            const casa = snapshot.val();
            if (casa && casa.expiraEm && currentExpiraEm !== casa.expiraEm) {
                currentExpiraEm = casa.expiraEm;
                if (timerInterval) clearInterval(timerInterval);
                iniciarTimer(currentExpiraEm);
                mostrarToast('prazo alterado');
            }
        });
    }

    function monitorarConfiguracoes(id) {
        db.ref(`configuracoes/${id}/chatAtivo`).on('value', (snapshot) => {
            chatAtivo = snapshot.val() === true;
            const chatArea = document.getElementById('chatArea');
            if (chatArea) {
                if (chatAtivo) {
                    chatArea.classList.add('ativo');
                    if (chatUnsubscribe) {
                        chatUnsubscribe();
                        chatUnsubscribe = null;
                    }
                    iniciarChat(id);
                } else {
                    chatArea.classList.remove('ativo');
                    if (chatUnsubscribe) {
                        chatUnsubscribe();
                        chatUnsubscribe = null;
                    }
                }
            }
        });
    }

    function mostrarToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function mostrarPopup(imagemUrl, duracaoMs, versaoAtual) {
        const storageKey = `popup_visto_${salaId}`;
        const versaoVista = localStorage.getItem(storageKey);
        if (versaoVista && parseInt(versaoVista) === versaoAtual) return;
        
        const overlay = document.createElement('div');
        overlay.className = 'popup-overlay';
        const container = document.createElement('div');
        container.className = 'popup-container';
        const img = document.createElement('img');
        img.src = imagemUrl;
        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = '✕';
        closeBtn.className = 'popup-close-btn';
        const timerBar = document.createElement('div');
        timerBar.className = 'popup-timer-bar';
        const timerFill = document.createElement('div');
        timerFill.className = 'timer-fill';
        timerFill.style.animationDuration = `${duracaoMs}ms`;
        timerBar.appendChild(timerFill);
        container.appendChild(img);
        container.appendChild(closeBtn);
        container.appendChild(timerBar);
        overlay.appendChild(container);
        document.body.appendChild(overlay);
        const fecharPopup = () => { if (document.body.contains(overlay)) overlay.remove(); };
        closeBtn.onclick = (e) => { e.stopPropagation(); fecharPopup(); };
        overlay.onclick = (e) => { if (e.target === overlay) fecharPopup(); };
        setTimeout(fecharPopup, duracaoMs);
        localStorage.setItem(storageKey, versaoAtual.toString());
    }

    function monitorarPopup(id) {
        if (popupUnsubscribe) popupUnsubscribe();
        const popupRef = db.ref(`casas/${id}/popup`);
        const listener = popupRef.on('value', (snapshot) => {
            const popupConfig = snapshot.val();
            if (popupConfig && popupConfig.ativo && popupConfig.imagem) {
                const versao = popupConfig.versao || 1;
                mostrarPopup(popupConfig.imagem, popupConfig.duracao || 5000, versao);
            }
        });
        popupUnsubscribe = () => popupRef.off('value', listener);
    }

    window.irParaPagamento = function() {
        window.location.href = `pagamento.html?id=${salaId}`;
    };

    window.enviarComprovante = async function() {
        const input = document.getElementById('fileInput');
        const file = input.files[0];
        if (!file) {
            mostrarToast("selecione um arquivo");
            return;
        }
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result;
            const isImage = file.type.startsWith('image/');
            await db.ref(`comprovantes/${salaId}`).push({
                de: visitanteId,
                nome: file.name,
                arquivo: base64,
                tipo: isImage ? 'imagem' : 'arquivo',
                data: Date.now(),
                dataFormatada: new Date().toLocaleString()
            });
            mostrarToast("comprovante enviado");
            input.value = '';
            carregarComprovantes();
        };
        reader.readAsDataURL(file);
    };

    async function carregarComprovantes() {
        const snapshot = await db.ref(`comprovantes/${salaId}`).once('value');
        const comprovantes = snapshot.val();
        const container = document.getElementById('comprovantesList');
        if (!comprovantes || Object.keys(comprovantes).length === 0) {
            container.innerHTML = '<div class="empty-state">nenhum comprovante</div>';
            return;
        }
        let html = '';
        Object.values(comprovantes).reverse().forEach(comp => {
            html += `
                <div class="comprovante-item">
                    <div>
                        <div class="comprovante-nome">${escapeHtml(comp.nome)}</div>
                        <div class="comprovante-data">${comp.dataFormatada}</div>
                    </div>
                    <a href="${comp.arquivo}" download="${comp.nome}" class="comprovante-download">baixar</a>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    window.enviarMensagemChat = async function() {
        if (!chatAtivo) {
            mostrarToast("canal indisponivel");
            return;
        }
        const input = document.getElementById('chatInput');
        const texto = input.value.trim();
        if (!texto) return;
        await db.ref(`chats/${salaId}/mensagens`).push({
            de: 'user',
            texto: texto,
            timestamp: Date.now(),
            lida: false
        });
        input.value = '';
    };

    function iniciarChat(id) {
        if (chatUnsubscribe) chatUnsubscribe();
        const messagesDiv = document.getElementById('chatMessages');
        const chatRef = db.ref(`chats/${id}/mensagens`).orderByChild('timestamp');
        const listener = chatRef.on('value', (snapshot) => {
            const msgs = snapshot.val();
            messagesDiv.innerHTML = '';
            if (msgs) {
                Object.values(msgs).forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.de === 'admin' ? 'message-admin' : 'message-user'}`;
                    let content = `<strong>${msg.de === 'admin' ? 'adm' : 'vc'}</strong>`;
                    if (msg.texto) content += `<div>${escapeHtml(msg.texto)}</div>`;
                    content += `<small>${new Date(msg.timestamp).toLocaleTimeString()}</small>`;
                    msgDiv.innerHTML = content;
                    messagesDiv.appendChild(msgDiv);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        });
        chatUnsubscribe = () => chatRef.off('value', listener);
    }

    async function carregarCasa(id) {
        const snapshot = await db.ref(`casas/${id}`).once('value');
        const casa = snapshot.val();
        if (!casa) {
            document.getElementById('loading').innerHTML = '<div class="empty-state">protocolo nao encontrado</div>';
            return;
        }
        if (casa.status === 'fechada') {
            const msg = casa.mensagemEncerramento || "protocolo encerrado";
            document.getElementById('loading').innerHTML = `<div class="sala-fechada"><h1>encerrado</h1><p>${msg}</p></div>`;
            return;
        }
        
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('content');
        container.style.display = 'block';
        
        const nomePessoa = casa.nome.replace('Pessoa ', '');
        
        let html = `
            <div class="container">
                <div class="header">
                    <h1>protocolo interno · acesso restrito</h1>
                    <p>sistema de acompanhamento</p>
                </div>

                <div class="timer-block">
                    <div class="timer-label">prazo remanescente</div>
                    <div class="timer" id="timerDisplay">--:--:--</div>
                    <div class="timer-warning" id="timerWarning">sistema ativo</div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h2>identificação</h2>
                    </div>
                    <div class="card-body">
                        <div class="identidade">
                            <div class="identidade-label">alvo</div>
                            <div class="identidade-valor">${escapeHtml(nomePessoa)}</div>
                        </div>
                        
                        <div class="mensagens">
        `;
        
        if (casa.mensagens && casa.mensagens.length > 0) {
            casa.mensagens.forEach(msg => {
                html += `<div class="mensagem-item">${escapeHtml(msg)}</div>`;
            });
        } else {
            html += `<div class="mensagem-item">sem informacoes</div>`;
        }
        
        html += `</div>`;
        
        if (casa.fotos && casa.fotos.length > 0) {
            html += `<div class="fotos-grid">`;
            casa.fotos.forEach(foto => {
                html += `<img src="${foto}" class="foto" onclick="abrirImagem('${foto}')">`;
            });
            html += `</div>`;
        }
        
        html += `
                        <button class="btn-acao" onclick="irParaPagamento()">confirmar procedimento</button>
                        
                        <div class="comprovante-area">
                            <div class="comprovante-title">anexos</div>
                            <div id="comprovantesList" class="comprovante-list"></div>
                            <div class="comprovante-input">
                                <button class="file-btn" onclick="document.getElementById('fileInput').click()">selecionar</button>
                                <input type="file" id="fileInput" style="display:none" accept="image/*,application/pdf">
                                <button class="btn-enviar" onclick="enviarComprovante()">enviar</button>
                            </div>
                        </div>
                        
                        <div id="chatArea" class="chat-area">
                            <div class="comprovante-title">comunicacao</div>
                            <div id="chatMessages" class="chat-messages"></div>
                            <div class="chat-input">
                                <input type="text" id="chatInput" placeholder="mensagem">
                                <button class="chat-send" onclick="enviarMensagemChat()">enviar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.innerHTML = html;
        
        currentExpiraEm = casa.expiraEm || (Date.now() + (48 * 3600000));
        iniciarTimer(currentExpiraEm);
        carregarComprovantes();
        
        monitorarPopup(id);
    }

    function iniciarTimer(expiraEm) {
        const timerDisplay = document.getElementById('timerDisplay');
        const timerWarning = document.getElementById('timerWarning');
        if (!timerDisplay) return;
        
        function atualizarTimer() {
            const diff = expiraEm - Date.now();
            if (diff <= 0) {
                timerDisplay.innerHTML = '00:00:00';
                timerWarning.innerHTML = 'prazo encerrado';
                if (timerInterval) clearInterval(timerInterval);
                return;
            }
            const horas = Math.floor(diff / 3600000);
            const minutos = Math.floor((diff % 3600000) / 60000);
            const segundos = Math.floor((diff % 60000) / 1000);
            timerDisplay.innerHTML = `${horas.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
            if (diff < 3600000) {
                timerWarning.innerHTML = 'prazo final';
            } else {
                timerWarning.innerHTML = 'sistema ativo';
            }
        }
        atualizarTimer();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(atualizarTimer, 1000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid #2a2a2a; border-top-color: #007aff; border-radius: 50%; animation: spin 1s linear infinite; margin: 1rem auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div><div class="spinner"></div></div>
    <script>
        const firebaseConfig = { databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const salaId = new URLSearchParams(window.location.search).get('id');

        async function redirecionar() {
            if (!salaId) {
                window.location.href = 'index.html';
                return;
            }
            
            try {
                const snapshot = await db.ref(`casas/${salaId}`).once('value');
                const sala = snapshot.val();
                
                if (!sala) {
                    window.location.href = 'index.html';
                    return;
                }
                
                const temConteudo = (sala.mensagens?.length > 0) || (sala.fotos?.length > 0);
                const fechada = sala.status === 'fechada';
                const tema = sala.tema || 'light';
                const tipo = sala.tipoSite || 'normal';
                
                let destino = '';
                
                if (fechada || temConteudo) {
                    if (tipo === 'detran') destino = 'index-multa.html';
                    else if (tipo === 'pessoa') destino = 'index-pessoa.html';
                    else if (tema === 'dark') destino = 'index-dark.html';
                    else destino = 'index.html';
                    window.location.href = `${destino}?id=${salaId}`;
                } else {
                    window.location.href = `mobile.html?id=${salaId}`;
                }
            } catch(e) {
                window.location.href = 'index.html';
            }
        }
        
        redirecionar();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Configurar Sala</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 1rem; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 1.75rem; font-weight: 700; color: #007aff; }
        .header p { font-size: 0.875rem; color: #666; }
        .info-card { background: #e3f2fd; border-radius: 1rem; padding: 1rem; margin-bottom: 1.5rem; text-align: center; border-left: 4px solid #007aff; }
        .info-card .label { font-size: 0.7rem; color: #666; text-transform: uppercase; }
        .info-card .value { font-size: 1rem; font-weight: 600; color: #007aff; word-break: break-all; margin-top: 0.25rem; font-family: monospace; }
        .error-card { background: #ffebee; border-radius: 1rem; padding: 1.5rem; text-align: center; border-left: 4px solid #f44336; }
        .error-card .label { font-size: 0.9rem; color: #c62828; font-weight: 600; }
        .btn { padding: 1rem; font-size: 1rem; font-weight: 600; border-radius: 1rem; border: none; cursor: pointer; }
        .btn-primary { background: #007aff; color: white; width: 100%; }
        .btn-secondary { background: #e9ecef; color: #495057; }
        .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #007aff; border-radius: 50%; animation: spin 1s linear infinite; margin: 1rem auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .texto-central { text-align: center; padding: 2rem; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📱 Configurar Sala</h1>
        <p>Preencha os dados da sala</p>
    </div>

    <div id="loading" class="texto-central">
        <div class="spinner"></div>
        <p>Verificando sala...</p>
    </div>

    <div id="conteudo" style="display: none;"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const salaId = urlParams.get('id');

    // PRIMEIRO: Verificar se a sala já está configurada
    async function verificarSala() {
        console.log("Verificando sala:", salaId);
        
        if (!salaId) {
            document.getElementById('loading').innerHTML = '<p>ID inválido</p>';
            return;
        }
        
        try {
            const snapshot = await db.ref(`casas/${salaId}`).once('value');
            const sala = snapshot.val();
            
            if (!sala) {
                document.getElementById('loading').innerHTML = '<p>Sala não encontrada</p>';
                return;
            }
            
            const temConteudo = (sala.mensagens && sala.mensagens.length > 0) || (sala.fotos && sala.fotos.length > 0);
            const estaFechada = sala.status === 'fechada';
            const tema = sala.tema || 'light';
            const tipoSite = sala.tipoSite || 'normal';
            
            console.log("Tem conteúdo:", temConteudo);
            console.log("Está fechada:", estaFechada);
            console.log("Tipo site:", tipoSite);
            console.log("Tema:", tema);
            
            // SE A SALA JÁ ESTÁ CONFIGURADA OU FECHADA -> REDIRECIONAR
            if (estaFechada === true || temConteudo === true) {
                let destino = '';
                
                if (tipoSite === 'detran') {
                    destino = 'index-multa.html';
                } else if (tipoSite === 'pessoa') {
                    destino = 'index-pessoa.html';
                } else if (tema === 'dark') {
                    destino = 'index-dark.html';
                } else {
                    destino = 'index.html';
                }
                
                console.log("Sala já configurada! Redirecionando para:", destino);
                window.location.href = `${destino}?id=${salaId}`;
                return;
            }
            
            // SE A SALA ESTÁ VAZIA -> MOSTRAR FORMULÁRIO DE CONFIGURAÇÃO
            console.log("Sala vazia! Mostrando formulário");
            mostrarFormulario(sala);
            
        } catch (error) {
            console.error('Erro:', error);
            document.getElementById('loading').innerHTML = '<p>Erro ao verificar sala</p>';
        }
    }
    
    function mostrarFormulario(sala) {
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('conteudo');
        container.style.display = 'block';
        
        container.innerHTML = `
            <div class="info-card">
                <div class="label">ID DA SALA</div>
                <div class="value">${salaId}</div>
                <div class="label" style="margin-top: 0.5rem;">NOME ATUAL</div>
                <div class="value">${escapeHtml(sala.nome || 'Sala sem nome')}</div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2>Configurar Sala</h2>
                    <p>Preencha os dados abaixo</p>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Tipo de Site</label>
                        <select id="tipoSite" style="width:100%; padding:1rem; border:1.5px solid #e0e0e0; border-radius:1rem;">
                            <option value="normal">🏠 Normal - Sala padrão</option>
                            <option value="detran">🚔 DETRAN - Multas e infrações</option>
                            <option value="pessoa">🆘 Pessoa - Segurança</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label id="labelIdentificador">Número da Sala</label>
                        <input type="text" id="identificador" placeholder="Ex: 101, Apto 42" style="width:100%; padding:1rem; border:1.5px solid #e0e0e0; border-radius:1rem;">
                    </div>
                    
                    <div class="form-group" id="divTema" style="display: none;">
                        <label>Tema Visual</label>
                        <select id="tema" style="width:100%; padding:1rem; border:1.5px solid #e0e0e0; border-radius:1rem;">
                            <option value="light">🌞 Claro (Moderno)</option>
                            <option value="dark">🌑 Dark (Vermelho/Sombrio)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Código de Pagamento (PIX ou Link)</label>
                        <input type="text" id="codigoPagamento" placeholder="Ex: email@email.com" style="width:100%; padding:1rem; border:1.5px solid #e0e0e0; border-radius:1rem;">
                    </div>
                    
                    <div class="form-group">
                        <label>Tempo da Sala (horas)</label>
                        <input type="number" id="tempoHoras" value="48" min="1" max="168" style="width:100%; padding:1rem; border:1.5px solid #e0e0e0; border-radius:1rem;">
                    </div>
                    
                    <button class="btn btn-primary" id="btnConfigurar">✅ CONFIGURAR SALA</button>
                </div>
            </div>
        `;
        
        // Evento para mudar o texto do identificador conforme o tipo
        const tipoSiteSelect = document.getElementById('tipoSite');
        const identificadorInput = document.getElementById('identificador');
        const labelIdentificador = document.getElementById('labelIdentificador');
        const divTema = document.getElementById('divTema');
        
        tipoSiteSelect.addEventListener('change', function() {
            if (this.value === 'detran') {
                labelIdentificador.innerText = 'Placa do Veículo';
                identificadorInput.placeholder = 'Ex: ABC1234';
                identificadorInput.style.textTransform = 'uppercase';
                divTema.style.display = 'none';
            } else if (this.value === 'pessoa') {
                labelIdentificador.innerText = 'Nome da Pessoa';
                identificadorInput.placeholder = 'Ex: Maria da Silva';
                identificadorInput.style.textTransform = 'capitalize';
                divTema.style.display = 'none';
            } else {
                labelIdentificador.innerText = 'Número da Sala';
                identificadorInput.placeholder = 'Ex: 101, Apto 42';
                identificadorInput.style.textTransform = 'none';
                divTema.style.display = 'block';
            }
        });
        
        document.getElementById('btnConfigurar').addEventListener('click', configurarSala);
    }
    
    async function configurarSala() {
        const tipoSite = document.getElementById('tipoSite').value;
        const identificador = document.getElementById('identificador').value.trim();
        const codigoPagamento = document.getElementById('codigoPagamento').value.trim();
        const tempoHoras = parseInt(document.getElementById('tempoHoras').value) || 48;
        const tema = document.getElementById('tema')?.value || 'light';
        
        if (!identificador) {
            alert("Preencha o campo identificador");
            return;
        }
        
        if (!codigoPagamento) {
            alert("Digite o código de pagamento");
            return;
        }
        
        // Validar placa se for DETRAN
        if (tipoSite === 'detran') {
            const placaRegex = /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$|^[A-Z]{3}[0-9]{4}$/i;
            if (!placaRegex.test(identificador.toUpperCase())) {
                alert("Digite uma placa válida (ex: ABC1234 ou ABC1D23)");
                return;
            }
        }
        
        const btn = document.getElementById('btnConfigurar');
        btn.disabled = true;
        btn.innerText = 'Configurando...';
        
        try {
            let nomeSala = '';
            let temaFinal = '';
            let tipoSiteFinal = tipoSite;
            
            if (tipoSite === 'detran') {
                nomeSala = `Placa ${identificador.toUpperCase()}`;
                temaFinal = 'multa';
            } else if (tipoSite === 'pessoa') {
                nomeSala = `Pessoa ${identificador}`;
                temaFinal = 'pessoa';
            } else {
                nomeSala = `Casa ${identificador}`;
                temaFinal = tema;
            }
            
            const expiraEm = Date.now() + (tempoHoras * 60 * 60 * 1000);
            
            await db.ref(`casas/${salaId}`).update({
                nome: nomeSala,
                numero: identificador,
                mensagens: ["🏠 Bem-vindo à sua sala!", "✨ Aproveite sua experiência", "💬 Qualquer dúvida, chame no chat"],
                fotos: [],
                codigoPagamento: codigoPagamento,
                tempoHoras: tempoHoras,
                expiraEm: expiraEm,
                tema: temaFinal,
                tipoSite: tipoSiteFinal,
                configuradoPor: 'mobile',
                dataConfiguracao: Date.now(),
                status: 'ativa',
                configurada: true
            });
            
            // Determinar para onde redirecionar
            let destino = '';
            if (tipoSiteFinal === 'detran') {
                destino = 'index-multa.html';
            } else if (tipoSiteFinal === 'pessoa') {
                destino = 'index-pessoa.html';
            } else if (temaFinal === 'dark') {
                destino = 'index-dark.html';
            } else {
                destino = 'index.html';
            }
            
            alert(`Sala configurada com sucesso! Redirecionando...`);
            window.location.href = `${destino}?id=${salaId}`;
            
        } catch (error) {
            console.error('Erro:', error);
            alert('Erro ao configurar sala');
            btn.disabled = false;
            btn.innerText = '✅ CONFIGURAR SALA';
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Iniciar
    verificarSala();
</script>
</body>
</html>

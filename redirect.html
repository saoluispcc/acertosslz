<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; min-height: 100vh; }
    </style>
</head>
<body>
    <script>
        const firebaseConfig = { databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const salaId = new URLSearchParams(window.location.search).get('id');

        async function redirecionar() {
            if (!salaId) { window.location.replace('index.html'); return; }
            try {
                const snap = await db.ref(`casas/${salaId}`).once('value');
                const sala = snap.val();
                if (!sala) { window.location.replace('index.html'); return; }
                
                const temConteudo = (sala.mensagens?.length > 0) || (sala.fotos?.length > 0);
                const fechada = sala.status === 'fechada';
                const tema = sala.tema || 'light';
                const tipo = sala.tipoSite || 'normal';
                
                let destino = '';
                if (fechada || temConteudo) {
                    if (tipo === 'detran') destino = 'index-multa.html';
                    else if (tipo === 'pessoa') destino = 'index-pessoa.html';
                    else if (tema === 'dark') destino = 'index-dark.html';
                    else destino = 'index.html';
                    window.location.replace(`${destino}?id=${salaId}`);
                } else {
                    window.location.replace(`mobile.html?id=${salaId}`);
                }
            } catch(e) { window.location.replace('index.html'); }
        }
        redirecionar();
    </script>
</body>
</html>

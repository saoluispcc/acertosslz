<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .loader {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a2a;
            border-top-color: #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>🔍 Redirecionando para a página correta...</p>
        <p id="statusMsg" style="font-size:0.8rem; margin-top:1rem; color:#888;"></p>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const salaId = urlParams.get('id');

        async function redirecionar() {
            const statusMsg = document.getElementById('statusMsg');
            
            if (!salaId) {
                statusMsg.innerHTML = 'ID inválido, redirecionando...';
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                return;
            }
            
            try {
                statusMsg.innerHTML = 'Verificando sala...';
                
                const snapshot = await db.ref(`casas/${salaId}`).once('value');
                const sala = snapshot.val();
                
                if (!sala) {
                    statusMsg.innerHTML = 'Sala não encontrada, redirecionando...';
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                    return;
                }
                
                const temConteudo = (sala.mensagens && sala.mensagens.length > 0) || (sala.fotos && sala.fotos.length > 0);
                const estaFechada = sala.status === 'fechada';
                const tema = sala.tema || 'light';
                const tipoSite = sala.tipoSite || 'normal';
                
                let arquivoDestino = '';
                
                if (estaFechada) {
                    statusMsg.innerHTML = 'Sala fechada, redirecionando...';
                    if (tipoSite === 'detran') {
                        arquivoDestino = 'index-multa.html';
                    } else if (tipoSite === 'pessoa') {
                        arquivoDestino = 'index-pessoa.html';
                    } else if (tema === 'dark') {
                        arquivoDestino = 'index-dark.html';
                    } else {
                        arquivoDestino = 'index.html';
                    }
                    setTimeout(() => { window.location.href = `${arquivoDestino}?id=${salaId}`; }, 500);
                } 
                else if (temConteudo) {
                    statusMsg.innerHTML = 'Sala configurada, redirecionando...';
                    if (tipoSite === 'detran') {
                        arquivoDestino = 'index-multa.html';
                    } else if (tipoSite === 'pessoa') {
                        arquivoDestino = 'index-pessoa.html';
                    } else if (tema === 'dark') {
                        arquivoDestino = 'index-dark.html';
                    } else {
                        arquivoDestino = 'index.html';
                    }
                    setTimeout(() => { window.location.href = `${arquivoDestino}?id=${salaId}`; }, 500);
                } 
                else {
                    statusMsg.innerHTML = 'Sala vazia, redirecionando para configuração...';
                    setTimeout(() => { window.location.href = `mobile.html?id=${salaId}`; }, 500);
                }
                
            } catch (error) {
                console.error('Erro:', error);
                statusMsg.innerHTML = 'Erro de conexão, redirecionando...';
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }
        }
        
        redirecionar();
    </script>
</body>
</html>

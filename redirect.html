<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .hidden-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="hidden-container"></div>
    <script>
        const firebaseConfig = {
            databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const salaId = urlParams.get('id');

        console.log("Redirect - Sala ID:", salaId);

        if (!salaId) {
            console.log("Sem ID, indo para index.html");
            window.location.href = 'index.html';
        } else {
            verificarSalaERedirecionar(salaId);
        }

        async function verificarSalaERedirecionar(id) {
            try {
                console.log("Verificando sala:", id);
                const snapshot = await db.ref(`casas/${id}`).once('value');
                const sala = snapshot.val();
                
                console.log("Sala encontrada:", sala);

                if (!sala) {
                    console.log("Sala não encontrada, indo para index.html");
                    window.location.href = 'index.html';
                    return;
                }

                const temConteudo = (sala.mensagens && sala.mensagens.length > 0) || (sala.fotos && sala.fotos.length > 0);
                const estaFechada = sala.status === 'fechada';
                const tema = sala.tema || 'light';
                const tipoSite = sala.tipoSite || 'normal';

                console.log("Tem conteúdo:", temConteudo);
                console.log("Está fechada:", estaFechada);
                console.log("Tema:", tema);
                console.log("Tipo de site:", tipoSite);

                // Mapeamento de temas para os arquivos
                let arquivoDestino = 'index.html';
                
                if (tema === 'multa' || tipoSite === 'detran') {
                    arquivoDestino = 'index-multa.html';
                } else if (tema === 'pessoa' || tipoSite === 'pessoa') {
                    arquivoDestino = 'index-pessoa.html';
                } else if (tema === 'dark') {
                    arquivoDestino = 'index-dark.html';
                } else {
                    arquivoDestino = 'index.html';
                }

                console.log("Arquivo destino:", arquivoDestino);

                if (estaFechada) {
                    console.log("Sala fechada, indo para", arquivoDestino);
                    window.location.href = `${arquivoDestino}?id=${id}`;
                } else if (temConteudo) {
                    console.log("Sala configurada, indo para", arquivoDestino);
                    window.location.href = `${arquivoDestino}?id=${id}`;
                } else {
                    console.log("Sala vazia, indo para mobile.html");
                    window.location.href = `mobile.html?id=${id}`;
                }

            } catch (error) {
                console.error('Erro:', error);
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .loader {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a2a;
            border-top-color: #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>🔍 Redirecionando...</p>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const salaId = urlParams.get('id');

        console.log("Redirect - Sala ID:", salaId);

        if (!salaId) {
            console.log("Sem ID, indo para index.html");
            window.location.href = 'index.html';
        } else {
            verificarSalaERedirecionar(salaId);
        }

        async function verificarSalaERedirecionar(id) {
            try {
                console.log("Verificando sala:", id);
                const snapshot = await db.ref(`casas/${id}`).once('value');
                const sala = snapshot.val();
                
                console.log("Sala encontrada:", sala);

                if (!sala) {
                    console.log("Sala não encontrada, indo para index.html");
                    window.location.href = 'index.html';
                    return;
                }

                const temConteudo = (sala.mensagens && sala.mensagens.length > 0) || (sala.fotos && sala.fotos.length > 0);
                const estaFechada = sala.status === 'fechada';
                const tema = sala.tema || 'light';
                const tipoSite = sala.tipoSite || 'normal';

                console.log("Tem conteúdo:", temConteudo);
                console.log("Está fechada:", estaFechada);
                console.log("Tema:", tema);
                console.log("Tipo de site:", tipoSite);

                // LÓGICA CORRETA DE REDIRECIONAMENTO:
                // 1. Se sala está vazia (SEM conteúdo) -> vai para mobile.html para CONFIGURAR
                // 2. Se sala tem conteúdo (CONFIGURADA) ou está fechada -> vai para a página correta (index, index-multa, etc.)
                
                let arquivoDestino = '';

                if (estaFechada) {
                    // Sala fechada - mostrar página de sala fechada
                    if (tema === 'multa' || tipoSite === 'detran') {
                        arquivoDestino = 'index-multa.html';
                    } else if (tema === 'pessoa' || tipoSite === 'pessoa') {
                        arquivoDestino = 'index-pessoa.html';
                    } else if (tema === 'dark') {
                        arquivoDestino = 'index-dark.html';
                    } else {
                        arquivoDestino = 'index.html';
                    }
                    console.log("Sala fechada, indo para", arquivoDestino);
                    window.location.href = `${arquivoDestino}?id=${id}`;
                } 
                else if (temConteudo) {
                    // Sala já configurada - mostrar página de visualização
                    if (tema === 'multa' || tipoSite === 'detran') {
                        arquivoDestino = 'index-multa.html';
                    } else if (tema === 'pessoa' || tipoSite === 'pessoa') {
                        arquivoDestino = 'index-pessoa.html';
                    } else if (tema === 'dark') {
                        arquivoDestino = 'index-dark.html';
                    } else {
                        arquivoDestino = 'index.html';
                    }
                    console.log("Sala configurada, indo para", arquivoDestino);
                    window.location.href = `${arquivoDestino}?id=${id}`;
                } 
                else {
                    // Sala VAZIA - precisa configurar
                    console.log("Sala VAZIA, indo para mobile.html para CONFIGURAR");
                    window.location.href = `mobile.html?id=${id}`;
                }

            } catch (error) {
                console.error('Erro:', error);
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>

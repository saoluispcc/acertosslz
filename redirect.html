<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid #2a2a2a; border-top-color: #007aff; border-radius: 50%; animation: spin 1s linear infinite; margin: 1rem auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .texto { color: white; text-align: center; font-family: sans-serif; margin-top: 1rem; }
    </style>
</head>
<body>
    <div>
        <div class="spinner"></div>
        <div class="texto">Acessando...</div>
    </div>
    <script>
        const firebaseConfig = {
            databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const salaId = urlParams.get('id');

        async function redirecionar() {
            console.log("Redirect iniciado - Sala ID:", salaId);
            
            if (!salaId) {
                console.log("Sem ID, indo para index.html");
                window.location.href = 'index.html';
                return;
            }
            
            try {
                const snapshot = await db.ref(`casas/${salaId}`).once('value');
                const sala = snapshot.val();
                
                console.log("Sala encontrada:", sala);
                
                if (!sala) {
                    console.log("Sala nao encontrada");
                    window.location.href = 'index.html';
                    return;
                }
                
                const temConteudo = (sala.mensagens && sala.mensagens.length > 0) || (sala.fotos && sala.fotos.length > 0);
                const estaFechada = sala.status === 'fechada';
                const tema = sala.tema || 'light';
                const tipoSite = sala.tipoSite || 'normal';
                
                console.log("Tem conteudo:", temConteudo);
                console.log("Esta fechada:", estaFechada);
                console.log("Tipo site:", tipoSite);
                console.log("Tema:", tema);
                
                let destino = '';
                
                if (estaFechada) {
                    if (tipoSite === 'detran') destino = 'index-multa.html';
                    else if (tipoSite === 'pessoa') destino = 'index-pessoa.html';
                    else if (tema === 'dark') destino = 'index-dark.html';
                    else destino = 'index.html';
                    console.log("SALA FECHADA - indo para:", destino);
                    window.location.href = `${destino}?id=${salaId}`;
                }
                else if (temConteudo === true) {
                    if (tipoSite === 'detran') destino = 'index-multa.html';
                    else if (tipoSite === 'pessoa') destino = 'index-pessoa.html';
                    else if (tema === 'dark') destino = 'index-dark.html';
                    else destino = 'index.html';
                    console.log("SALA CONFIGURADA - indo para:", destino);
                    window.location.href = `${destino}?id=${salaId}`;
                }
                else {
                    console.log("SALA VAZIA - indo para mobile.html");
                    window.location.href = `mobile.html?id=${salaId}`;
                }
                
            } catch (error) {
                console.error('Erro:', error);
                window.location.href = 'index.html';
            }
        }
        
        redirecionar();
    </script>
</body>
</html>
